[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hive"
version = "0.0.1"
description = "Hivemind v-min — single-tenant episodic recall store for an agent fleet (MCP server, hive_* tools)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Hivemind" }]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/Hivemind-OSS/Hivemind"
Repository = "https://github.com/Hivemind-OSS/Hivemind"
Issues = "https://github.com/Hivemind-OSS/Hivemind/issues"

[project.scripts]
# the operator CLI (stdlib-only); uninstalled: `python -m hive.tools.cli`
hive = "hive.tools.cli:main"

[project.optional-dependencies]
# Real embedder adapter (Phase 1); the pure domain + slice need none of these.
# Qwen3-Embedding needs sentence-transformers 5.x.
embed = ["sentence-transformers>=5.0"]
# Server-side census/verifier engines (hive.census + hive.verifier). The engines are
# first-party subpackages of THIS dist (hive.matrix, hive.combdrift) — the census is
# their only consumer; drift asks git directly. There is no separate distribution and no
# vendored wheelhouse, so this extra declares only their third-party dependencies:
# networkx (matrix's symbol graph), tree-sitter + the per-language grammars (the matrix +
# combdrift AST extractors), sqlglot (combdrift's SQL dialect), and jsonschema/defusedxml
# (the census receipt schema + XML-safe parse paths). tree-sitter is capped <0.26: the
# committed matrix AST goldens were built on 0.25.x and 0.26 drifts them. tree-sitter-sql
# is DELIBERATELY dev-only (see the dev extra) — the image excludes it so extract_sql
# degrades to its error-dict path, preserving production behavior parity.
sync = [
    "jsonschema>=4.21,<5",
    "defusedxml>=0.7",
    "networkx>=3.4",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.23,<0.26",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.26",
    "tree-sitter-go>=0.23,<0.26",
    "tree-sitter-rust>=0.24,<0.26",
    "tree-sitter-c>=0.24,<0.26",
    "tree-sitter-cpp>=0.23,<0.26",
    "sqlglot>=30",
]
dev = [
    "pytest>=7",
    "hypothesis>=6.100",
    "hive[sync]",
    # SQL grammar for the matrix/combdrift SQL-extraction goldens + regen tool. DEV-ONLY:
    # the image omits it so extract_sql degrades to its error-dict path (behavior parity) —
    # it must NOT enter the sync extra.
    "tree-sitter-sql>=0.3",
    # `make check` tooling: format/lint + strict typecheck legs.
    "ruff>=0.8",
    "mypy>=1.15",
    # Typeshed stubs for third-party deps that ship none themselves; installing the
    # stubs keeps `mypy --strict` honest instead of ignore_missing_imports overrides.
    "types-jsonschema>=4.21",
    "types-defusedxml>=0.7",
    "types-networkx>=3",
]

[tool.setuptools.packages.find]
# Ship the hive package (+ tests for editable checkouts). The repo-root scripts/ utilities are
# intentionally excluded from the built wheel — they are dev/eval helpers, not runtime code.
include = ["hive*", "tests*"]

[tool.setuptools.package-data]
# The versioned receipt schema is hive.census's write-boundary contract; without this
# declaration a wheel build silently drops the .json and load_schema() dies at runtime.
"hive.census" = ["receipt.v0.schema.json"]

[tool.mypy]
# Pinned so the gate is machine-independent. 3.12 (not the 3.11 requires-python floor)
# because installed numpy's stubs use PEP 695 `type` statements, which mypy rejects under
# a 3.11 target. The strict flag itself lives in the `make check` recipe
# (`mypy hive/ --strict`) so the gate's severity is visible in one place.
python_version = "3.12"

[[tool.mypy.overrides]]
# sentence-transformers is the heavy `embed`-only dependency (~1.2 GB with its model
# stack), deliberately kept out of the gate env — `make check` installs only the `dev`
# extra. It ships no py.typed marker and no types-* stubs package exists, so its lazy
# imports (hive/tools/bake_model.py, hive/adapters/embedding/local_st.py) resolve as
# Any under the gate. Override is stub-availability-only — never add first-party hive
# modules here.
module = ["sentence_transformers.*"]
ignore_missing_imports = true

[tool.ruff]
# The matrix extractor builds its graph over sample source under tests/matrix/fixtures
# (e.g. fixtures/python/app.py is the pinned input for the python.json golden). Those
# files' deliberately "unused" imports ARE the extraction spec, not lint debt — deleting
# them would drift the golden. Exclude the payload tree from format + lint so the gate can
# never force an edit to it. (Sibling helpers like fixtures_manifest.py stay in scope.)
extend-exclude = ["tests/matrix/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "embed: loads the real embedding model (~1.2 GB Qwen3-Embedding); deselect the heavy tier with -m 'not embed'",
]
