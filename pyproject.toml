[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hive"
version = "0.0.1"
description = "Hivemind v-min — single-tenant episodic recall store for an agent fleet (MCP server, hive_* tools)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Hivemind" }]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/Hivemind-OSS/Hivemind"
Repository = "https://github.com/Hivemind-OSS/Hivemind"
Issues = "https://github.com/Hivemind-OSS/Hivemind/issues"

[project.scripts]
# the operator CLI (stdlib-only); uninstalled: `python -m hive.tools.cli`
hive = "hive.tools.cli:main"

[project.optional-dependencies]
# Real embedder adapter (Phase 1); the pure domain + slice need none of these.
# Qwen3-Embedding needs sentence-transformers 5.x.
embed = ["sentence-transformers>=5.0"]
dev = ["pytest>=7"]
# Dev-time benchmark harness (hive/research/bench): the LongMemEval head-to-head vs mem0.
# mem0 is run offline (local embedder, infer=False) — never a runtime dependency of the server.
bench = ["hive[embed]", "mem0ai==2.0.7", "huggingface-hub>=0.20"]

[tool.setuptools.packages.find]
# Ship the hive package (+ tests for editable checkouts). The repo-root scripts/ utilities are
# intentionally excluded from the built wheel — they are dev/eval helpers, not runtime code.
# hive.research is the dev-time benchmark harness (heavy optional deps); it stays in the
# repo for editable checkouts but is NOT shipped in the built wheel an operator installs.
include = ["hive*", "tests*"]
exclude = ["hive.research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "embed: loads the real embedding model (~1.2 GB Qwen3-Embedding); deselect the heavy tier with -m 'not embed'",
]
