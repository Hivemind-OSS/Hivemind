[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hive"
version = "0.0.1"
description = "Hivemind v-min — single-tenant episodic recall store for an agent fleet (MCP server, hive_* tools)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Hivemind" }]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/Hivemind-OSS/Hivemind"
Repository = "https://github.com/Hivemind-OSS/Hivemind"
Issues = "https://github.com/Hivemind-OSS/Hivemind/issues"

[project.scripts]
# the operator CLI (stdlib-only); uninstalled: `python -m hive.tools.cli`
hive = "hive.tools.cli:main"

[project.optional-dependencies]
# Real embedder adapter (Phase 1); the pure domain + slice need none of these.
# Qwen3-Embedding needs sentence-transformers 5.x.
embed = ["sentence-transformers>=5.0"]
# Server-side census/verifier engines (hive.census + hive.verifier) and the sync
# subsystem's mint shell-out. comb-drift + matrix are DIRECT deps (hive/census/join.py,
# receipt.py, and hive/app/sync.py import them by name), hive-edge carries the in-image
# mint CLI; jsonschema/defusedxml are the moved engines' own third-party deps (the
# reduced hive-edge 0.7.0 does not carry them). The three engine names are DELIBERATELY
# bare and never resolve from a package index: the server host receives ONLY this repo,
# so the image build pre-installs the committed vendor/wheels/ wheelhouse (refreshed by
# scripts/vendor_edge.py) before this extra resolves, and dev/uv pins the names to the
# same wheelhouse via [tool.uv.sources] below (BUG-023).
sync = [
    "hive-edge",
    "comb-drift",
    "matrix",
    "jsonschema>=4.21,<5",
    "defusedxml>=0.7",
]
dev = [
    "pytest>=7",
    "hypothesis>=6.100",
    "hive[sync]",
    # `make check` tooling: format/lint + strict typecheck legs.
    "ruff>=0.8",
    "mypy>=1.15",
    # Typeshed stubs for third-party deps that ship none themselves; installing the
    # stubs keeps `mypy --strict` honest instead of ignore_missing_imports overrides.
    "types-jsonschema>=4.21",
    "types-defusedxml>=0.7",
    "types-networkx>=3",
]

[tool.setuptools.packages.find]
# Ship the hive package (+ tests for editable checkouts). The repo-root scripts/ utilities are
# intentionally excluded from the built wheel — they are dev/eval helpers, not runtime code.
include = ["hive*", "tests*"]

[tool.setuptools.package-data]
# The versioned receipt schema is hive.census's write-boundary contract; without this
# declaration a wheel build silently drops the .json and load_schema() dies at runtime.
"hive.census" = ["receipt.v0.schema.json"]

# Dev-time resolution of the vendored engine names: uv resolves hive-edge / comb-drift /
# matrix from the SAME committed wheels the image installs (vendor/wheels/) — never from
# a package index (`matrix` on PyPI is an unrelated, name-squatted project) and never
# from a sibling checkout: the hivemind system has ZERO interaction with the hive-edge
# workspace; the wheelhouse IS the distribution channel (BUG-023). Exact-wheel paths
# (not a flat index: uv serializes index URLs into uv.lock as machine-absolute file://
# paths, breaking the committed lock across checkouts; path sources stay relative).
# scripts/vendor_edge.py rewrites these three lines on every refresh — never hand-edit.
# pip (the image build) ignores this table and is satisfied by the pre-installed
# wheelhouse instead.
[tool.uv.sources]
hive-edge = { path = "vendor/wheels/hive_edge-0.9.0-py3-none-any.whl" }
comb-drift = { path = "vendor/wheels/comb_drift-0.9.0-py3-none-any.whl" }
matrix = { path = "vendor/wheels/matrix-0.9.0-py3-none-any.whl" }

[tool.mypy]
# Pinned so the gate is machine-independent. 3.12 (not the 3.11 requires-python floor)
# because installed numpy's stubs use PEP 695 `type` statements, which mypy rejects under
# a 3.11 target. The strict flag itself lives in the `make check` recipe
# (`mypy hive/ --strict`) so the gate's severity is visible in one place.
python_version = "3.12"

[[tool.mypy.overrides]]
# comb-drift and matrix are the vendored engine wheels (vendor/wheels/, refreshed by
# scripts/vendor_edge.py). Neither ships a py.typed marker and no types-* stubs package
# exists for them, so their imports resolve as Any. Override is stub-availability-only —
# never add first-party hive modules here.
module = ["combdrift.*", "matrix.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "embed: loads the real embedding model (~1.2 GB Qwen3-Embedding); deselect the heavy tier with -m 'not embed'",
]
