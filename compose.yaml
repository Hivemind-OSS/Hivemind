name: hive
services:
  hive-server:
    build: { context: ., dockerfile: Dockerfile }
    image: hive:vmin
    # ALL HIVE_* config is sourced from ONE file — .env. Every key has a safe code default
    # (see hive/app/config.py), so .env carries only deliberate operator overrides.
    # `required: false` keeps compose parsing when .env is absent (the container then boots
    # fully on defaults, tenant_id="default" included). See .env.example.
    env_file:
      - path: .env
        required: false
    # Image invariants — NOT config knobs (the brain image is hermetically offline).
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - hive-data:/data
    # The warm daemon (PID 1) serves MCP over HTTP on TWO doors (auth is a property of the
    # listening socket): a tokenless LOOPBACK door on 8765 and a token-required TUNNEL door on
    # 8766. Only 8765 is host-published, and LOOPBACK-ONLY: the daemon binds 0.0.0.0 INSIDE the
    # container (so the Docker port map can reach it), but the host side is 127.0.0.1 only. The
    # tunnel door (8766) is NEVER host-published — it is reachable only over the compose network
    # (the ngrok sidecar below), so a remote caller is ALWAYS bearer-gated. No stdin_open/tty —
    # an HTTP service does not attach to stdin (the superseded stdio transport needed it).
    ports:
      - "127.0.0.1:8765:8765"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "hive.tools.healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
  # ---- OPT-IN PUBLIC TUNNEL (profile: tunnel) — Part A ----------
  # Outbound, NAT-traversing HTTPS tunnel to the daemon — reachable from any OS/network.
  # Profile-gated: a plain `docker compose up` does NOT start this (AC2). Forwards over the
  # COMPOSE NETWORK to the TOKEN-REQUIRED tunnel door (hive-server:8766), NEVER the tokenless
  # loopback door (8765), so the public endpoint is always bearer-gated. No host port is
  # published here and the daemon needs no LAN bind (D5). ngrok lives in its own image — the
  # hive image stays hermetically offline (D1/AC3). TLS terminates at the ngrok edge, so the
  # bearer token is never cleartext on an untrusted hop.
  ngrok:
    image: ngrok/ngrok:3
    profiles: ["tunnel"]
    # `:-` (not `:?`) so a non-tunnel `up` still parses; `hive up --tunnel` fail-fasts on
    # these before invoking the tunnel profile (secrets-via-env at the front door).
    environment:
      NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN:-}"
    # `--url` pins the account's (free) static domain so the teammate URL is STABLE across
    # restarts; ngrok v3 flag. Forwards to the daemon's TOKEN-REQUIRED tunnel door (8766) over
    # the compose net — never the tokenless loopback door (8765).
    command: ["http", "hive-server:8766", "--url", "${NGROK_DOMAIN:-}"]
    depends_on:
      hive-server: { condition: service_healthy }   # only tunnel a daemon that's actually warm
    restart: unless-stopped
  # ---- FUTURE SWAP (commented; uncovering it is the only change to externalize) ----
  # embedder:
  #   image: hive-embedder:vmin
  #   # flip HIVE_EMBEDDING__TRANSPORT=loopback on hive-server; no core rebuild.
  # producer:
  #   image: hive:vmin
  #   command: ["python","-m","hive.app.producer_loop"]
  #   volumes: [ "hive-data:/data" ]   # shares the single WAL via BEGIN IMMEDIATE (future concurrency design)
volumes:
  hive-data:
    name: hive-data
