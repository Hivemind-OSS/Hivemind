name: hive
services:
  hive-server:
    build: { context: ., dockerfile: Dockerfile }
    image: hive:vmin
    # ${VAR:?msg} → compose FAILS FAST if HIVE_TENANT_ID is unset (no silent default).
    environment:
      HIVE_TENANT_ID: "${HIVE_TENANT_ID:?HIVE_TENANT_ID is required (single-tenant boundary)}"
      HIVE_AGENT_ID: "${HIVE_AGENT_ID:-default-agent}"
      # HIVE_TENANT_ID / HIVE_AGENT_ID / HIVE_STORE__DB_PATH are entrypoint-owned operator
      # aliases (bridged into Config.load); the keys below route through M-config's
      # HIVE_<GROUP>__<FIELD> namespace and MUST name a real (group, field) — see
      # tests/container/test_compose.py::test_compose_env_keys_resolve.
      HIVE_STORE__DB_PATH: "/data/shared.db"
      HIVE_EMBEDDING__MODEL: "BAAI/bge-small-en-v1.5"
      HIVE_OBS__LOG_LEVEL: "20"            # 20 == logging.INFO (obs.log_level is an int level)
      HIVE_RETENTION__BACKUP_KEEP: "30"
      # ── guarantee firewall (config.GUARANTEE_KNOBS) ──
      # Pinned at layer 3 (env) so a value the tuning agent writes in /data/hive.toml
      # (layer 2) is silently overridden — the agent structurally cannot loosen a safety
      # guarantee. The ${VAR:-default} floor lives in git here (auditable); an operator
      # MAY tighten via .env. The pin set == GUARANTEE_KNOBS is locked by test_compose.py.
      HIVE_RECALL__H_FRAC_MAX: "${HIVE_RECALL__H_FRAC_MAX:-0.5}"
      HIVE_RECALL__EPSILON_EXPLORE: "${HIVE_RECALL__EPSILON_EXPLORE:-0.1}"
      HIVE_UTILITY__ISOLATION_FRAC: "${HIVE_UTILITY__ISOLATION_FRAC:-0.05}"
      HIVE_AUTONOMY__ENABLED: "${HIVE_AUTONOMY__ENABLED:-true}"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - hive-data:/data
      - ./hive.config.toml:/data/hive.toml:ro   # agent-tunable config layer (read-only into the container)
    # The warm daemon (PID 1) serves MCP over HTTP. The host mapping is LOOPBACK-ONLY: the
    # daemon binds 0.0.0.0 INSIDE the container (so the Docker port map can reach it), but the
    # host side is 127.0.0.1 only — never exposed beyond host-loopback (NOT "exposed to the
    # network"). Remote use goes through an SSH tunnel or a reverse proxy; the
    # per-device bearer token is the identity + revocation regardless. No stdin_open/tty — an
    # HTTP service does not attach to stdin (the superseded stdio transport needed it).
    ports:
      - "127.0.0.1:8765:8765"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "hive.tools.healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
  # ---- OPT-IN PUBLIC TUNNEL (profile: tunnel) — Part A ----------
  # Outbound, NAT-traversing HTTPS tunnel to the daemon — reachable from any OS/network.
  # Profile-gated: a plain `docker compose up` does NOT start this (AC2). Reaches the
  # daemon over the COMPOSE NETWORK (hive-server:8765), so NO host port is published here
  # and the daemon needs no LAN bind (D5). ngrok lives in its own image — the hive image
  # stays hermetically offline (D1/AC3). TLS terminates at the ngrok edge, so the bearer
  # token is never cleartext on an untrusted hop.
  ngrok:
    image: ngrok/ngrok:3
    profiles: ["tunnel"]
    # `:-` (not `:?`) so a non-tunnel `up` still parses; `hive up --tunnel` fail-fasts on
    # these before invoking the tunnel profile (secrets-via-env at the front door).
    environment:
      NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN:-}"
    # `--url` pins the account's (free) static domain so the teammate URL is STABLE across
    # restarts; ngrok v3 flag. Forwards to the daemon's in-container port over the compose net.
    command: ["http", "hive-server:8765", "--url", "${NGROK_DOMAIN:-}"]
    depends_on:
      hive-server: { condition: service_healthy }   # only tunnel a daemon that's actually warm
    restart: unless-stopped
  # ---- FUTURE SWAP (commented; uncovering it is the only change to externalize) ----
  # embedder:
  #   image: hive-embedder:vmin
  #   # flip HIVE_EMBEDDING__TRANSPORT=loopback on hive-server; no core rebuild.
  # producer:
  #   image: hive:vmin
  #   command: ["python","-m","hive.app.producer_loop"]
  #   volumes: [ "hive-data:/data" ]   # shares the single WAL via BEGIN IMMEDIATE (future concurrency design)
volumes:
  hive-data:
    name: hive-data
