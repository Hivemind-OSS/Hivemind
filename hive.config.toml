# hive.config.toml — the AGENT-tunable config layer (precedence layer 2: TOML).
#
# Mounted read-only into the container at /data/hive.toml and read at boot by
# Config.load (hive/app/config.py). Empty == all code defaults; boot is byte-identical
# to env-only config.
#
# Rules for a tuning agent:
#   - Edit ONLY knobs whose CONFIG_AUTHORITY (hive/app/config.py) == "agent".
#   - Stay inside SAFE_BOUNDS; consult KPI_MOVED for what each knob moves.
#   - "operator" guarantee knobs written here are SILENTLY OVERRIDDEN by the compose
#     env-pins (layer 3 > layer 2) — they will not take effect.
#   - One knob per window: apply with `hive down && hive up`, then commit (git = audit log).
#
# Example (commented; uncomment + adjust one line to tune):
# [autonomy]
# demand_tau = 0.75
